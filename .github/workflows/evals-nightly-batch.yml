name: evals-nightly-batch

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (00:00 CDMX)
  workflow_dispatch:

# ── Single-observation safety ──
#
# This workflow spends real provider money on every execution, and it has two
# triggers that know nothing about each other: the 06:00 schedule and manual
# dispatch. Without a concurrency boundary a dispatched nightly can run while a
# scheduled one is mid-batch, producing two simultaneous paid observations of
# the same thing.
#
# The group is a *literal* string rather than an expression, deliberately: any
# `github.ref` / `github.sha` component would give a dispatch on a different ref
# its own group and let it overlap the scheduled run, which is precisely the
# case this exists to prevent. One constant group means one in-flight nightly,
# whatever triggered it.
#
# `cancel-in-progress: false` is the other half. A nightly that is already
# talking to the provider has already been paid for; cancelling it to start a
# newer one would destroy that spend and leave an ambiguous partial observation
# behind. A later trigger therefore waits instead, and each queued execution
# still binds its own exact source SHA when it eventually runs.
concurrency:
  group: evals-nightly-batch
  cancel-in-progress: false

jobs:
  nightly-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mas/requirements.lock.txt

      - name: Install
        working-directory: mas
        run: |
          python -m pip install --upgrade pip==25.3
          python scripts/validate_requirements_lock.py
          python -m pip install -r requirements.lock.txt

      - name: Run batch evals
        working-directory: mas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.run_evals_batch --report evals/out/

      # Always uploaded, including under failure: `summary_batch.json` carries
      # the validity contract, so the artifact is what distinguishes a measured
      # quality regression from a provider outage. It is also the *only* output
      # side effect — the previous `failure()` issue-creation step was removed
      # because it ran in the job that holds ANTHROPIC_API_KEY, needed an
      # `issues: write` token, and filed "regression" issues for runs that had
      # measured nothing. No GitHub write replaces it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-batch-report
          path: mas/evals/out/
