name: tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes ~28 minutes against the Postgres service, so a 30-minute
    # cap left under two minutes of headroom -- and a runner that stalls on I/O
    # spends that instantly. One run was killed at 77% with zero failures after
    # the Postgres container logged a 270-second checkpoint.
    #
    # A timeout is a runaway-job backstop, not a performance budget: when it
    # fires this close to the normal runtime it reports infrastructure variance
    # as a red build, which is exactly the "provider/infra inability reported as
    # a quality failure" confusion this release is trying to eliminate.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: v4_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/v4_test
      TEST_EVIDENCE_PG_DSN: postgresql://postgres:postgres@localhost:5432/v4_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mas/requirements.txt

      - name: Install dependencies
        working-directory: mas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: mas
        run: python -m pytest tests -q
