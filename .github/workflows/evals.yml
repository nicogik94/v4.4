name: evals

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled]
    paths:
      - 'mas/prompts/**'
      - 'mas/orchestrator.py'
      - 'mas/llm_client.py'
      - 'mas/config.py'
      - 'mas/evals/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Pass rate threshold (0.0-1.0)'
        required: false
        default: '0.75'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: mas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test (mock mode)
        working-directory: mas
        run: python -m evals.run_evals --mock

  provider-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'paid-eval')) }}
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI SDK
        run: python -m pip install 'openai>=1.60.0'

      - name: Verify OpenAI provider availability
        working-directory: mas
        env:
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_LOG: ''
        run: python -m evals.provider_preflight

  real-eval-shard:
    if: ${{ needs.provider-preflight.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'paid-eval'))) }}
    needs: [smoke, provider-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: mas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify OpenAI-only provider posture
        working-directory: mas
        env:
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          test -z "$ANTHROPIC_API_KEY"

      - name: Run eval shard
        working-directory: mas
        env:
          # Intentionally empty: real evals must not make billable Anthropic calls.
          ANTHROPIC_API_KEY: ''
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Failure provenance for this shard only. Observational: it records
          # what each provider invocation returned so a future release
          # observation is interpretable. It adds no provider call, no shard, no
          # judge call and no model call, and it does not change scoring. Off by
          # default everywhere else, including mock/smoke and aggregate.
          MAS_EVAL_PROVENANCE: '1'
        run: |
          python -m evals.run_evals \
            --shard-index ${{ matrix.shard }} \
            --shard-count 6 \
            --report evals/out/shard-${{ matrix.shard }} \
            --threshold ${{ github.event.inputs.threshold || '0.75' }}

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-shard-${{ matrix.shard }}
          path: mas/evals/out/shard-${{ matrix.shard }}/

  aggregate:
    needs: [provider-preflight, real-eval-shard]
    if: ${{ always() && needs.provider-preflight.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'paid-eval'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: mas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: eval-report-shard-*
          path: mas/evals/shards

      - name: Aggregate eval reports
        working-directory: mas
        run: |
          python -m evals.run_evals \
            --aggregate evals/shards/eval-report-shard-* \
            --report evals/out/ \
            --threshold ${{ github.event.inputs.threshold || '0.75' }}

      - name: Upload aggregate eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: mas/evals/out/

      - name: Post summary
        if: always()
        working-directory: mas
        run: |
          if [ -f evals/out/summary.json ]; then
            echo "## Eval Results" >> $GITHUB_STEP_SUMMARY
            python -c "
          import json
          d = json.load(open('evals/out/summary.json'))
          print(f\"**{d['passed']}/{d['total']} passed** ({d['pass_rate']:.1%})\")
          if d.get('aggregation_errors'):
              print()
              print('Aggregation errors:')
              for e in d['aggregation_errors']:
                  print(f'- {e}')
          print()
          print('| Case | Pass | Judge | Domain | FW | Must-mention |')
          print('|------|------|-------|--------|----|--------------|')
          for c in d['cases']:
              icon = '✅' if c['passed'] else '❌'
              print(f\"| {c['case_id']} | {icon} | {c['judge_overall']} | {c['domain_match']} | {c['frameworks_covered']:.2f} | {c['must_mention_hits']:.2f} |\")
          " >> $GITHUB_STEP_SUMMARY
          fi
